name: LaunchFrame Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/launchframe-worker.yml'
  repository_dispatch:
    types: [launchframe-render]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: launchframe-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify worker revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          grep -n "MAX_RUNTIME\|POLL_MS" worker/run-once.ts || true

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-dejavu chromium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --omit=dev

      - name: Process queued render jobs
        working-directory: worker
        run: |
          for attempt in 1 2 3 4 5; do
            echo "[LaunchFrame] Worker pass $attempt/5"
            npx tsx run-once.ts
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}
          VOICE_VOLUME: ${{ secrets.VOICE_VOLUME }}
