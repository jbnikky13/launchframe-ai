name: LaunchFrame Render Worker

on:
  repository_dispatch:
    types: [launchframe-render]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional LaunchFrame render job ID'
        required: false
        type: string

concurrency:
  group: launchframe-render-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      VOICE_VOLUME: ${{ vars.VOICE_VOLUME || '1' }}
      MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME || '0.12' }}
      LAUNCHFRAME_JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id || '' }}
      WORKER_POLL_MS: '5000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg and SVG renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Validate worker configuration
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL GitHub secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY GitHub secret" && exit 1)
          if [ -n "$LAUNCHFRAME_JOB_ID" ]; then echo "Target render job: $LAUNCHFRAME_JOB_ID"; else echo "Worker will process queued jobs"; fi

      - name: Run render worker
        run: npx tsx worker/index.ts
