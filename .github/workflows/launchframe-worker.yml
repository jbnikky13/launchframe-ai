name: LaunchFrame Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/launchframe-worker.yml'
  repository_dispatch:
    types: [launchframe-render]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: launchframe-render-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify worker revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Event: ${{ github.event_name }}"
          echo "Job ID: ${{ github.event.client_payload.job_id }}"

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-dejavu chromium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --omit=dev

      - name: Process render immediately
        working-directory: worker
        run: npx tsx run-once.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}
          VOICE_VOLUME: ${{ secrets.VOICE_VOLUME }}
