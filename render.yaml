services:
  - type: worker
    name: launchframe-render-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./
    plan: starter
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_VOICE
        value: Kore
      - key: VOICE_VOLUME
        value: "1"
      - key: WORKER_POLL_MS
        value: "5000"
