name: LaunchFrame Worker

on:
  repository_dispatch:
    types: [launchframe-render]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Each dispatched render gets its own concurrency group, while the 5-minute
# sweeper is serialized separately. This prevents one render from stealing
# another render's job while still allowing independent user renders to run.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('launchframe-job-{0}', github.event.client_payload.job_id) || 'launchframe-sweeper' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify worker revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Event: ${{ github.event_name }}"
          echo "Job ID: ${{ github.event.client_payload.job_id }}"

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-dejavu
          ffmpeg -version | head -n 1
          rsvg-convert --version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --omit=dev --no-audit --no-fund

      - name: Process render immediately
        working-directory: worker
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}
          VOICE_VOLUME: ${{ secrets.VOICE_VOLUME }}
          MUSIC_VOLUME: ${{ secrets.MUSIC_VOLUME }}
        run: npx tsx run-once.ts
